name: Publish build output to a branch

# Copies a finished build's DLL, symbols and full job log onto the
# "build-output" branch, so they can be fetched with plain git.

on:
  workflow_run:
    workflows: ["Build FittingRoom.dll"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id to publish"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    # Failed builds publish their log too, onto "build-failed", so the last
    # good DLL on "build-output" is never replaced by a broken run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
    steps:
      - name: Download the plugin
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: FittingRoom-WornItem
          path: out/FittingRoom-WornItem
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the symbols
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: FittingRoom-pdb
          path: out/pdb
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the build log
        run: |
          set -x
          mkdir -p out
          api="https://api.github.com/repos/${{ github.repository }}"
          job=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/$RUN_ID/jobs" | jq -r '.jobs[0].id')
          # curl drops the Authorization header on the cross-host redirect to
          # blob storage, which is what that storage requires.
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api/actions/jobs/$job/logs" -o out/build-log.txt \
            || echo "log fetch failed" > out/build-log.txt
          ls -la out/build-log.txt
          sha=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/$RUN_ID" | jq -r '.head_sha')
          {
            echo "run: $RUN_ID"
            echo "source commit: $sha"
            find out -type f | sort
            sha256sum out/FittingRoom-WornItem/SKSE/Plugins/FittingRoom.dll || true
          } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt

      - name: Commit to the build-output branch
        run: |
          cd out
          branch=build-output
          if [ ! -f FittingRoom-WornItem/SKSE/Plugins/FittingRoom.dll ]; then branch=build-failed; fi
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build output for run $RUN_ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch"
